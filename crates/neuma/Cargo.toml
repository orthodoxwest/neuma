[package]
name = "neuma"
description = "Engraves Gregorian chant (square notation) from GABC for any front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["multimedia", "rendering", "parser-implementations"]
# The tests read files elsewhere in the repository, so they stay out of the package.
exclude = ["tests/"]

[features]
default = ["svg", "fonts"]
svg = []
# `neuma::json`: the outputs as the JSON the browser package and the CLI give (no dependencies).
json = []
# The built-in EB Garamond metrics tables (about 108 KB): both, or one of them. A
# `LyricFont` whose table is left out measures as the other.
fonts = ["font-google", "font-garamond12"]
# The table for the EB Garamond Google Fonts serves (about 85 KB).
font-google = []
# The table for the EB Garamond 12 release (about 23 KB).
font-garamond12 = []

# Document `neuma::json` too.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
