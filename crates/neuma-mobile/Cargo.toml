[package]
name = "neuma-mobile"
description = "UniFFI bindings for neuma, for iOS and Android apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "neuma_mobile"
# Only an rlib, so apps that wrap this crate in their own UniFFI crate don't build unused
# native libraries. Build those with `cargo rustc --crate-type cdylib` (Android) or
# `--crate-type staticlib` (iOS); see the README.

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
neuma = { workspace = true, features = ["fonts"] }
neuma-tones = { workspace = true, default-features = true }
uniffi.workspace = true

# No workspace lint table: UniFFI's generated scaffolding is `unsafe` FFI glue, which the
# workspace's `unsafe_code = "forbid"` would reject. This crate's own code stays safe.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
wildcard_enum_match_arm = "deny"
