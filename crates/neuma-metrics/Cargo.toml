[package]
name = "neuma-metrics"
description = "Builds neuma's font metrics tables from OpenType fonts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gregorian", "chant", "font-metrics", "opentype", "kerning"]
categories = ["development-tools::build-utils", "text-processing"]
# The tests read files elsewhere in the repository, so they stay out of the package.
exclude = ["tests/"]

[dependencies]
neuma.workspace = true
rustybuzz.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The collisions example lays scores out with the built-in tables.
neuma = { workspace = true, default-features = true }
