name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request supersedes the run before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Third-party actions are pinned to commits; the comment names the release, or the branch
# for dtolnay/rust-toolchain, which has no releases. Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # Each published crate carries the license files, and packages and builds on its own.
      - name: Package the crates
        run: |
          for crate in neuma neuma-tones neuma-book neuma-metrics neuma-cli; do
            for file in LICENSE-APACHE LICENSE-MIT NOTICE; do cmp "$file" "crates/$crate/$file"; done
          done
          cargo package --workspace --exclude neuma-mobile --exclude neuma-wasm --exclude readme-images
  # The oldest Rust the workspace supports: `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
  # Licenses, RustSec advisories, banned crates and sources, as deny.toml sets them.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  browser:
    runs-on: ubuntu-latest
    env:
      # dist/neuma.mjs with every default feature was 466,959 bytes (456 KB) in October 2026.
      # The budget leaves about 3% for growth; raise it in a change that says why it grew.
      NEUMA_MJS_BUDGET: 481280 # 470 KiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: cargo build -p neuma-wasm --target wasm32-unknown-unknown --profile wasm
      - run: npm install --no-save binaryen@132.0.0 typescript@6.0.2
      - run: node crates/neuma-wasm/build.mjs node_modules/binaryen/bin/wasm-opt
      - name: Check the module's size
        run: |
          size=$(stat -c %s crates/neuma-wasm/dist/neuma.mjs)
          echo "dist/neuma.mjs: $size bytes, budget $NEUMA_MJS_BUDGET"
          if [ "$size" -gt "$NEUMA_MJS_BUDGET" ]; then
            echo "::error::dist/neuma.mjs is $size bytes, over its budget of $NEUMA_MJS_BUDGET (see ci.yml)"
            exit 1
          fi
      - run: node crates/neuma-wasm/test.mjs
      - run: node_modules/.bin/tsc -p crates/neuma-wasm/js
      # The parts a build can leave out still build without them.
      - run: cargo clippy -p neuma-wasm --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - run: cargo clippy -p neuma-wasm --target wasm32-unknown-unknown --no-default-features --features tones,font-garamond12 -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neuma-browser
          path: |
            crates/neuma-wasm/dist/neuma.mjs
            crates/neuma-wasm/dist/neuma-external.mjs
            crates/neuma-wasm/dist/neuma.wasm
            crates/neuma-wasm/dist/neuma.d.mts
  mobile:
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: 2.1.0
      # JetBrains' kotlin-compiler-2.1.0.zip.sha256 from the release.
      KOTLIN_SHA256: b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297
      JNA_VERSION: 5.14.0
      # The jar whose SHA-1 matches Maven Central's jna-5.14.0.jar.sha1.
      JNA_SHA256: 34ed1e1f27fa896bca50dbc4e99cf3732967cec387a7a0d5e3486c09673fe8c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: cargo check -p neuma-mobile --target aarch64-linux-android --target x86_64-linux-android --target aarch64-apple-ios --target aarch64-apple-ios-sim
      - name: Fetch the Kotlin compiler and JNA
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/jna.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          printf '%s  %s\n' "$KOTLIN_SHA256" "$RUNNER_TEMP/kotlinc.zip" "$JNA_SHA256" "$RUNNER_TEMP/jna.jar" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
      - run: crates/neuma-mobile/test.sh
        env:
          NEUMA_KOTLINC: ${{ runner.temp }}/kotlinc/bin/kotlinc
          NEUMA_JNA: ${{ runner.temp }}/jna.jar
  mobile-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: crates/neuma-mobile/test.sh
