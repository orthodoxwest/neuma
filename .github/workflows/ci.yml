name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p neuma-wasm --target wasm32-unknown-unknown --profile wasm
      - run: npm install --no-save binaryen@132.0.0
      - run: node crates/neuma-wasm/build.mjs node_modules/binaryen/bin/wasm-opt
      - run: node crates/neuma-wasm/test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neuma-browser
          path: crates/neuma-wasm/dist/neuma.mjs
