# Rendered output must be byte-identical on every platform. `mul_add` rounds once where
# `a * b + c` rounds twice, and where the target has no FMA instruction it falls back to the
# platform's `fma`. The other functions here come from the platform's libm, whose precision
# Rust leaves unspecified, so their last bits can differ from one platform to the next.
# (`sqrt` and the basic operations are correctly rounded everywhere, so they are allowed.)
disallowed-methods = [
    { path = "f32::mul_add", reason = "rounds differently from `a * b + c` and depends on the platform's FMA; output must be byte-identical across platforms" },
    { path = "f64::mul_add", reason = "rounds differently from `a * b + c` and depends on the platform's FMA; output must be byte-identical across platforms" },
    { path = "f32::powf", reason = "precision varies with the platform's libm; output must be byte-identical across platforms" },
    { path = "f32::exp", reason = "precision varies with the platform's libm; output must be byte-identical across platforms" },
    { path = "f32::exp2", reason = "precision varies with the platform's libm; output must be byte-identical across platforms" },
    { path = "f32::exp_m1", reason = "precision varies with the platform's libm; output must be byte-identical across platforms" },
