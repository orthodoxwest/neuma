[workspace]
resolver = "3"
members = ["crates/neuma", "crates/neuma-book", "crates/neuma-cli", "crates/neuma-metrics", "crates/neuma-mobile", "crates/neuma-tones", "crates/neuma-wasm", "tools/readme"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds and tests the workspace (1.95 stabilized `if let` guards); CI
# checks it in the `msrv` job.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orthodoxwest/neuma"
keywords = ["gabc", "gregorian", "chant", "music-notation", "engraving"]

# Every version the workspace depends on, in one place. The workspace's own crates leave
# their default features off here, so each member names the ones it needs.
[workspace.dependencies]
neuma = { path = "crates/neuma", version = "0.1.0", default-features = false }
neuma-book = { path = "crates/neuma-book", version = "0.1.0" }
neuma-tones = { path = "crates/neuma-tones", version = "0.1.0", default-features = false }
rustybuzz = "0.20"
sha2 = "0.10"
uniffi = "0.32"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
wildcard_enum_match_arm = "allow"

# `cargo build --profile wasm --target wasm32-unknown-unknown -p neuma-wasm`: the browser module.
# Optimized for speed: over `opt-level = "s"` it engraves and lays out about 20% faster in
# the browser for 5% more module.
[profile.wasm]
inherits = "release"
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
